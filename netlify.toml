[build]
command = "npm run build --workspace @taskflow/client"
publish = "client/dist"

[build.environment]
NODE_VERSION = "22"
MONGOMS_DISABLE_POSTINSTALL = "1"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
